name: Staging Deployment

on:
  push:
    branches:
      - develop
      - feature/devops-pipeline-aws
  workflow_dispatch:

permissions:
  id-token: write # Required for requesting AWS OIDC token
  contents: read  # Required for checkout

jobs:
  terraform-init:
    name: Terraform Init (OIDC)
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-southeast-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Terraform Format Check
        run: terraform -chdir=infra/environments/staging fmt -check

      - name: Terraform Init
        run: terraform -chdir=infra/environments/staging init

      - name: Terraform Validate
        run: terraform -chdir=infra/environments/staging validate
