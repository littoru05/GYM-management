name: Infrastructure Cost Control (Pause/Resume/Hibernate)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (staging or prod)'
        required: true
        type: choice
        options:
          - staging
          - prod
        default: 'staging'
      action:
        description: 'Action to perform on target infrastructure'
        required: true
        type: choice
        options:
          - pause
          - hibernate
          - resume
        default: 'pause'

permissions:
  contents: read

jobs:
  control-infrastructure:
    name: Execute ${{ github.event.inputs.action }} on ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-southeast-1
      TARGET_ENV: ${{ github.event.inputs.environment || 'staging' }}
      ECS_CLUSTER: gym-${{ github.event.inputs.environment || 'staging' }}-cluster
      BACKEND_SERVICE: gym-${{ github.event.inputs.environment || 'staging' }}-backend
      FRONTEND_SERVICE: gym-${{ github.event.inputs.environment || 'staging' }}-frontend
      ALB_NAME: gym-${{ github.event.inputs.environment || 'staging' }}-alb
      RDS_IDENTIFIER: gym-${{ github.event.inputs.environment || 'staging' }}-mysql
      TF_WORKING_DIR: infra/environments/${{ github.event.inputs.environment || 'staging' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # --- CHẾ ĐỘ 1: PAUSE (Nghỉ ngắn trong ngày - Giữ nguyên ALB & RDS) ---
      - name: Pause ECS Services (Scale desired-count to 0)
        if: ${{ github.event.inputs.action == 'pause' }}
        run: |
          echo "Pausing $TARGET_ENV environment by scaling ECS tasks down to 0..."
          for SERVICE in "$BACKEND_SERVICE" "$FRONTEND_SERVICE"; do
            echo "Updating service ($SERVICE) desired-count to 0..."
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$SERVICE" \
              --desired-count 0
          done

          echo "### ⏸️ Đã tạm dừng ECS Containers (Pause) - $TARGET_ENV" >> $GITHUB_STEP_SUMMARY
          echo "- **Môi trường:** \`$TARGET_ENV\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Trạng thái:** ECS Tasks đã hạ về \`0\`. **ALB vẫn đang giữ nguyên** nên \`alb_dns_name\` không đổi." >> $GITHUB_STEP_SUMMARY
          if [ "$TARGET_ENV" = "prod" ]; then
            echo "- **Cơ sở dữ liệu (RDS):** Instance \`$RDS_IDENTIFIER\` vẫn tiếp tục chạy trong chế độ Pause để phục hồi tức thì." >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Lưu ý:** Nếu nghỉ qua đêm hoặc nhiều ngày, hãy chạy lại workflow với tùy chọn **\`hibernate\`** để triệt tiêu chi phí ALB (và dừng RDS đối với prod)." >> $GITHUB_STEP_SUMMARY

      # --- CHẾ ĐỘ 3: RESUME - KHỞI ĐỘNG RDS TRƯỚC (Chỉ cho Production) ---
      - name: Start Production RDS Database (Resume)
        if: ${{ github.event.inputs.action == 'resume' && (github.event.inputs.environment == 'prod' || env.TARGET_ENV == 'prod') }}
        run: |
          echo "Checking status of production RDS instance: $RDS_IDENTIFIER..."
          for i in $(seq 1 60); do
            RDS_STATUS=$(aws rds describe-db-instances \
              --db-instance-identifier "$RDS_IDENTIFIER" \
              --region "${{ env.AWS_REGION }}" \
              --query 'DBInstances[0].DBInstanceStatus' \
              --output text 2>/dev/null || echo "not_found")
            echo "Current RDS status (attempt $i): $RDS_STATUS"
            if [ "$RDS_STATUS" = "stopped" ] || [ "$RDS_STATUS" = "available" ] || [ "$RDS_STATUS" = "not_found" ]; then
              break
            fi
            echo "RDS instance status is '$RDS_STATUS'. Waiting 30s for a stable state (stopped/available)..."
            sleep 30
          done

          if [ "$RDS_STATUS" = "stopped" ]; then
            echo "Starting RDS instance $RDS_IDENTIFIER..."
            aws rds start-db-instance \
              --db-instance-identifier "$RDS_IDENTIFIER" \
              --region "${{ env.AWS_REGION }}"
            echo "Waiting for RDS instance $RDS_IDENTIFIER to reach available status..."
            aws rds wait db-instance-available \
              --db-instance-identifier "$RDS_IDENTIFIER" \
              --region "${{ env.AWS_REGION }}"
            echo "RDS instance $RDS_IDENTIFIER is now available."
            echo "### 🗄️ Khởi động RDS MySQL (Resume)" >> $GITHUB_STEP_SUMMARY
            echo "- **Cơ sở dữ liệu (RDS):** Instance \`$RDS_IDENTIFIER\` đã được khởi động lại thành công (\`available\`)." >> $GITHUB_STEP_SUMMARY
          elif [ "$RDS_STATUS" = "available" ]; then
            echo "RDS instance $RDS_IDENTIFIER is already available."
            echo "### 🗄️ Trạng thái RDS MySQL" >> $GITHUB_STEP_SUMMARY
            echo "- **Cơ sở dữ liệu (RDS):** Instance \`$RDS_IDENTIFIER\` đã sẵn sàng (\`available\`)." >> $GITHUB_STEP_SUMMARY
          elif [ "$RDS_STATUS" = "not_found" ]; then
            echo "RDS instance $RDS_IDENTIFIER not found. It will be provisioned by Terraform."
            echo "### 🗄️ Trạng thái RDS MySQL" >> $GITHUB_STEP_SUMMARY
            echo "- **Cơ sở dữ liệu (RDS):** Instance \`$RDS_IDENTIFIER\` chưa tồn tại (sẽ được tạo mới qua Terraform)." >> $GITHUB_STEP_SUMMARY
          else
            echo "::error::RDS instance $RDS_IDENTIFIER is in unexpected state '$RDS_STATUS'."
            exit 1
          fi

      # --- CHẾ ĐỘ 3: RESUME - KIỂM TRA TRẠNG THÁI HẠ TẦNG (Nhận diện Pause hay Hibernate / Thiếu tài nguyên) ---
      - name: Check Infrastructure State (ALB Existence)
        if: ${{ github.event.inputs.action == 'resume' }}
        id: check-alb
        run: |
          echo "Checking infrastructure state for $TARGET_ENV..."
          ALB_FOUND=false
          if aws elbv2 describe-load-balancers --names "$ALB_NAME" --region "${{ env.AWS_REGION }}" > /dev/null 2>&1; then
            ALB_FOUND=true
            echo "ALB ($ALB_NAME) exists."
          else
            echo "ALB ($ALB_NAME) does not exist."
          fi

          SERVICES_AND_TASKS_EXIST=true
          for SERVICE in "$BACKEND_SERVICE" "$FRONTEND_SERVICE"; do
            if ! aws ecs describe-task-definition --task-definition "$SERVICE" --region "${{ env.AWS_REGION }}" > /dev/null 2>&1; then
              echo "Task definition ($SERVICE) does not exist."
              SERVICES_AND_TASKS_EXIST=false
            fi
            if ! aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$SERVICE" --region "${{ env.AWS_REGION }}" --query 'services[0].status' --output text 2>/dev/null | grep -q "^ACTIVE$"; then
              echo "ECS service ($SERVICE) does not exist or is inactive."
              SERVICES_AND_TASKS_EXIST=false
            fi
          done

          if [ "$TARGET_ENV" = "prod" ]; then
            RDS_CHECK=$(aws rds describe-db-instances --db-instance-identifier "$RDS_IDENTIFIER" --region "${{ env.AWS_REGION }}" --query 'DBInstances[0].DBInstanceStatus' --output text 2>/dev/null || echo "not_found")
            if [ "$RDS_CHECK" = "not_found" ]; then
              echo "RDS instance ($RDS_IDENTIFIER) does not exist."
              SERVICES_AND_TASKS_EXIST=false
            fi
          fi

          if [ "$ALB_FOUND" = "true" ] && [ "$SERVICES_AND_TASKS_EXIST" = "true" ]; then
            echo "alb_exists=true" >> $GITHUB_OUTPUT
            echo "All required infrastructure components exist. Resuming from PAUSE mode (Fast-path)..."
          else
            echo "alb_exists=false" >> $GITHUB_OUTPUT
            echo "Infrastructure missing or incomplete (ALB: $ALB_FOUND, Services/Tasks/RDS: $SERVICES_AND_TASKS_EXIST). Resuming via Terraform Apply (Full reconstruction)..."
          fi

      # --- CÀI ĐẶT TERRAFORM (Chỉ dùng cho Hibernate hoặc Resume từ Hibernate) ---
      - name: Setup Terraform
        if: ${{ github.event.inputs.action == 'hibernate' || (github.event.inputs.action == 'resume' && steps.check-alb.outputs.alb_exists == 'false') }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      # --- CHẾ ĐỘ 2: HIBERNATE (Nghỉ qua đêm / nhiều ngày - Xóa ALB & ECS Services) ---
      - name: Hibernate (Destroy ALB and ECS Services to stop all hourly charges)
        if: ${{ github.event.inputs.action == 'hibernate' }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "Destroying ECS Services and ALB for $TARGET_ENV to eliminate hourly ALB & compute costs..."
          terraform init
          terraform destroy \
            -target=module.ecs.aws_ecs_service.backend \
            -target=module.ecs.aws_ecs_service.frontend \
            -target=module.alb \
            -auto-approve

          echo "### 💤 Đã chuyển sang chế độ Ngủ đông (Hibernate) - $TARGET_ENV" >> $GITHUB_STEP_SUMMARY
          echo "- **Đã xóa:** Application Load Balancer (\`$ALB_NAME\`), Target Groups, và 2 ECS Services." >> $GITHUB_STEP_SUMMARY
          echo "- **Đã giữ lại:** Kho chứa ảnh Docker (\`ECR\`), \`VPC\`, \`ECS Cluster\`, \`Task Definitions\`, \`SSM Parameters\`." >> $GITHUB_STEP_SUMMARY
          echo "- **Chi phí theo giờ hiện tại:** **$0.00/giờ**." >> $GITHUB_STEP_SUMMARY

      - name: Stop Production RDS Database (Hibernate)
        if: ${{ github.event.inputs.action == 'hibernate' && (github.event.inputs.environment == 'prod' || env.TARGET_ENV == 'prod') }}
        run: |
          echo "Checking status of production RDS instance: $RDS_IDENTIFIER..."
          for i in $(seq 1 60); do
            RDS_STATUS=$(aws rds describe-db-instances \
              --db-instance-identifier "$RDS_IDENTIFIER" \
              --region "${{ env.AWS_REGION }}" \
              --query 'DBInstances[0].DBInstanceStatus' \
              --output text 2>/dev/null || echo "not_found")
            echo "Current RDS status (attempt $i): $RDS_STATUS"
            if [ "$RDS_STATUS" = "available" ] || [ "$RDS_STATUS" = "stopped" ] || [ "$RDS_STATUS" = "stopping" ] || [ "$RDS_STATUS" = "not_found" ]; then
              break
            fi
            echo "RDS instance status is '$RDS_STATUS' (transient). Waiting 30s before issuing stop-db-instance..."
            sleep 30
          done

          if [ "$RDS_STATUS" = "available" ]; then
            echo "Stopping RDS instance $RDS_IDENTIFIER..."
            aws rds stop-db-instance \
              --db-instance-identifier "$RDS_IDENTIFIER" \
              --region "${{ env.AWS_REGION }}"
            echo "RDS instance stop command issued successfully."
            echo "- **Cơ sở dữ liệu (RDS):** Instance \`$RDS_IDENTIFIER\` đã được gửi lệnh dừng (\`stop-db-instance\`) để ngưng tính giờ compute trong khi dữ liệu được bảo toàn." >> $GITHUB_STEP_SUMMARY
          elif [ "$RDS_STATUS" = "stopped" ] || [ "$RDS_STATUS" = "stopping" ]; then
            echo "RDS instance $RDS_IDENTIFIER is already $RDS_STATUS."
            echo "- **Cơ sở dữ liệu (RDS):** Instance \`$RDS_IDENTIFIER\` hiện đã ở trạng thái dừng (\`$RDS_STATUS\`)." >> $GITHUB_STEP_SUMMARY
          else
            echo "::error::RDS instance $RDS_IDENTIFIER could not be stopped from unexpected state '$RDS_STATUS'."
            exit 1
          fi

      - name: Resume from Pause (Scale ECS Services to 1)
        if: ${{ github.event.inputs.action == 'resume' && steps.check-alb.outputs.alb_exists == 'true' }}
        run: |
          echo "Resuming $TARGET_ENV environment from PAUSE by scaling ECS tasks up to 1..."
          for SERVICE in "$BACKEND_SERVICE" "$FRONTEND_SERVICE"; do
            LATEST_TASK_DEF=$(aws ecs describe-task-definition \
              --task-definition "$SERVICE" \
              --region "${{ env.AWS_REGION }}" \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text)
            echo "Updating service ($SERVICE) to latest task definition ($LATEST_TASK_DEF) and desired-count to 1..."
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$SERVICE" \
              --task-definition "$LATEST_TASK_DEF" \
              --desired-count 1 \
              --force-new-deployment
          done

          echo "### 🚀 Hệ thống $TARGET_ENV đã khởi động lại (Resume từ Pause)!" >> $GITHUB_STEP_SUMMARY
          echo "- **Chế độ:** Bật lại nhanh (Fast-path ~15s)." >> $GITHUB_STEP_SUMMARY
          echo "- **Trạng thái:** ECS Tasks đã tăng lên \`1\`. ALB được giữ nguyên." >> $GITHUB_STEP_SUMMARY

      - name: Resume from Hibernate (Rebuild ALB and ECS Services via Terraform)
        if: ${{ github.event.inputs.action == 'resume' && steps.check-alb.outputs.alb_exists == 'false' }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "Rebuilding ALB and ECS Services for $TARGET_ENV via Terraform Apply..."
          terraform init
          terraform apply -auto-approve

          echo "Ensuring latest task definition revision and desired-count 1 for both services..."
          for SERVICE in "$BACKEND_SERVICE" "$FRONTEND_SERVICE"; do
            LATEST_TASK_DEF=$(aws ecs describe-task-definition \
              --task-definition "$SERVICE" \
              --region "${{ env.AWS_REGION }}" \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text)
            echo "Updating service ($SERVICE) to latest task definition ($LATEST_TASK_DEF) and desired-count to 1..."
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$SERVICE" \
              --task-definition "$LATEST_TASK_DEF" \
              --desired-count 1 \
              --force-new-deployment
          done

          echo "### 🚀 Hệ thống $TARGET_ENV đã khởi động lại (Resume từ Hibernate)!" >> $GITHUB_STEP_SUMMARY
          echo "- **Chế độ:** Tái tạo hạ tầng đầy đủ qua Terraform (~2-3 phút)." >> $GITHUB_STEP_SUMMARY

      # --- ĐỒNG BỘ DUCKDNS & XUẤT ĐƯỜNG DẪN DUAL-LINK TRÊN SUMMARY ---
      - name: Update DuckDNS and Publish Dual Links
        if: ${{ github.event.inputs.action == 'resume' }}
        run: |
          echo "Fetching active ALB DNS name for $ALB_NAME..."
          ALB_DNS=$(aws elbv2 describe-load-balancers --names "$ALB_NAME" --region "${{ env.AWS_REGION }}" --query 'LoadBalancers[0].DNSName' --output text)

          if [ -z "$ALB_DNS" ] || [ "$ALB_DNS" == "None" ]; then
            echo "::error::Không tìm thấy ALB DNS name. Kiểm tra lại trạng thái ALB trên AWS."
            exit 1
          fi

          echo "Resolving IPv4 address for ALB: $ALB_DNS"
          ALB_IP=""
          for i in {1..15}; do
            ALB_IP=$(dig +short "$ALB_DNS" | grep -E '^[0-9.]+$' | head -n 1 || true)
            if [ -n "$ALB_IP" ]; then
              echo "Resolved ALB IP: $ALB_IP (attempt $i)"
              break
            fi
            echo "Attempt $i/15: Waiting for ALB DNS propagation (sleep 5s)..."
            sleep 5
          done

          # Resolve DuckDNS domain based on environment with fallback
          DUCKDNS_DOMAIN="${{ secrets.DUCKDNS_PROD_DOMAIN }}"
          if [ "$TARGET_ENV" != "prod" ] || [ -z "$DUCKDNS_DOMAIN" ]; then
            DUCKDNS_DOMAIN="${{ secrets.DUCKDNS_DOMAIN }}"
          fi

          if [ -z "$ALB_IP" ]; then
            echo "::warning::Không thể phân giải địa chỉ IPv4 từ ALB DNS trong 75 giây. Bỏ qua cập nhật DuckDNS."
            echo "### ⚠️ Cảnh báo DuckDNS - $TARGET_ENV" >> $GITHUB_STEP_SUMMARY
            echo "- Không thể phân giải IP từ ALB DNS (\`${ALB_DNS}\`) trong thời gian chờ (75s)." >> $GITHUB_STEP_SUMMARY
            echo "- Vui lòng sử dụng đường link ALB trực tiếp bên dưới." >> $GITHUB_STEP_SUMMARY
          elif [ -z "$DUCKDNS_DOMAIN" ] || [ -z "${{ secrets.DUCKDNS_TOKEN }}" ]; then
            echo "::notice::DuckDNS domain hoặc token không được cấu hình. Bỏ qua cập nhật DuckDNS."
            echo "### ℹ️ DuckDNS chưa cấu hình - $TARGET_ENV" >> $GITHUB_STEP_SUMMARY
            echo "- Vui lòng sử dụng đường link ALB trực tiếp bên dưới." >> $GITHUB_STEP_SUMMARY
          else
            echo "Updating DuckDNS (${DUCKDNS_DOMAIN}.duckdns.org) -> $ALB_IP..."
            RESPONSE=$(curl -s "https://www.duckdns.org/update?domains=${DUCKDNS_DOMAIN}&token=${{ secrets.DUCKDNS_TOKEN }}&ip=${ALB_IP}")

            if [ "$RESPONSE" != "OK" ]; then
              echo "::warning::Cập nhật DuckDNS không thành công (Phản hồi API: $RESPONSE)."
              echo "### ⚠️ Cập nhật DuckDNS thất bại - $TARGET_ENV" >> $GITHUB_STEP_SUMMARY
              echo "- Phản hồi từ DuckDNS API: \`${RESPONSE}\`" >> $GITHUB_STEP_SUMMARY
            else
              echo "DuckDNS updated successfully: OK"
              echo "### 🌐 Đường dẫn truy cập cố định (DuckDNS) - $TARGET_ENV" >> $GITHUB_STEP_SUMMARY
              echo "- **Web App:** [http://${DUCKDNS_DOMAIN}.duckdns.org](http://${DUCKDNS_DOMAIN}.duckdns.org)" >> $GITHUB_STEP_SUMMARY
              echo "- **Health Check Backend:** [http://${DUCKDNS_DOMAIN}.duckdns.org/api/health](http://${DUCKDNS_DOMAIN}.duckdns.org/api/health)" >> $GITHUB_STEP_SUMMARY
              echo "- **IP ALB hiện tại:** \`${ALB_IP}\`" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "### 🔗 Đường dẫn dự phòng (AWS ALB DNS gốc) - $TARGET_ENV" >> $GITHUB_STEP_SUMMARY
          echo "- **ALB URL:** [http://${ALB_DNS}](http://${ALB_DNS})" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Check Backend:** [http://${ALB_DNS}/api/health](http://${ALB_DNS}/api/health)" >> $GITHUB_STEP_SUMMARY
          echo "- *Lưu ý: Nếu truy cập tên miền DuckDNS gặp lỗi DNS cache cũ, hãy chạy \`ipconfig /flushdns\` trên máy hoặc sử dụng trực tiếp link ALB gốc ở trên.*" >> $GITHUB_STEP_SUMMARY
