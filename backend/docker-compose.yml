services:
  mysql:
    image: mysql:8.4
    container_name: gym-management-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_NAME:-gym_management}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}

    ports:
      - "${DB_PORT:-3307}:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mysql_data: