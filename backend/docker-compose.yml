services:
  mysql:
    image: mysql:8.0
    container_name: gym-management-mysql
    restart: unless-stopped

    mem_limit: 1g

    command:
      - --max-connections=100
      - --innodb-buffer-pool-size=512M
      - --log-error-verbosity=3
      - --slow-query-log=ON
      - --long-query-time=2
      - --log-output=FILE

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      MYSQL_DATABASE: ${DB_NAME:-gym_management}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}

    ports:
      - "${DB_PORT:-3307}:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mysql_data:
